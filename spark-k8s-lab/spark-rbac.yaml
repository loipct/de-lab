apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-operator-sa
  namespace: de-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-operator-role
  namespace: de-lab
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps", "secrets"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-operator-role-binding
  namespace: de-lab
subjects:
- kind: ServiceAccount
  name: spark-operator-sa
  namespace: de-lab
roleRef:
  kind: Role
  name: spark-operator-role
  apiGroup: rbac.authorization.k8s.io

