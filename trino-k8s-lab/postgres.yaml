apiVersion: v1
kind: Namespace
metadata:
  name: de-lab
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
  namespace: de-lab
data:
  01-init.sql: |
    CREATE TABLE employees (
      employee_id INT PRIMARY KEY,
      full_name VARCHAR(100),
      department VARCHAR(50),
      salary NUMERIC(10,2)
    );
    INSERT INTO employees VALUES
      (1, 'Nguyen Van A', 'Data', 1800),
      (2, 'Tran Thi B', 'Data', 2100),
      (3, 'Le Van C', 'Sales', 1500),
      (4, 'Pham Thi D', 'Sales', 1600),
      (5, 'Hoang Van E', 'Engineering', 2500);
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: de-lab
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-db
  namespace: de-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-db
  template:
    metadata:
      labels:
        app: postgres-db
    spec:
      containers:
      - name: postgres
        image: postgres:15
        env:
        - name: POSTGRES_DB
          value: labdb
        - name: POSTGRES_USER
          value: labuser
        - name: POSTGRES_PASSWORD
          value: labpassword
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: init-volume
          mountPath: /docker-entrypoint-initdb.d
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: init-volume
        configMap:
          name: postgres-init-script
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-db
  namespace: de-lab
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: postgres-db