apiVersion: v1
kind: Namespace
metadata:
  name: de-lab

---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-coordinator-base-config
  namespace: de-lab
data:
  node.properties: |
    node.environment=de_lab
    node.id=coordinator-1
    node.data-dir=/data/trino

  jvm.config: |
    -server
    -Xmx1G
    -XX:InitialRAMPercentage=80
    -XX:MaxRAMPercentage=80
    -XX:G1HeapRegionSize=32M
    -XX:+ExplicitGCInvokesConcurrent
    -XX:+ExitOnOutOfMemoryError

  config.properties: |
    coordinator=true
    node-scheduler.include-coordinator=true
    http-server.http.port=8080
    discovery.uri=http://trino-coordinator:8080
    

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-coordinator-catalog-config
  namespace: de-lab
data:
  tpch.properties: |
    connector.name=tpch
    tpch.splits-per-node=4

  postgres.properties: |
    connector.name=postgresql
    connection-url=jdbc:postgresql://postgres-db:5432/labdb
    connection-user=labuser
    connection-password=labpassword

  hive.properties: |
    # Hive connector left intentionally empty for now.
    # Add Hive metastore and MinIO (S3) deployment first, then
    # populate this file with the required connector properties,
    # for example:
    # connector.name=hive
    # hive.metastore.uri=thrift://hive-metastore:9083
    # hive.s3.endpoint=http://minio:9000
    # hive.s3.aws-access-key=<MINIO_ACCESS_KEY>
    # hive.s3.aws-secret-key=<MINIO_SECRET_KEY>
    # hive.s3.path-style-access=true
    # hive.non-managed-table-writes-enabled=true
    # hive.allow-drop-table=true
    
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: trino-pvc
  namespace: de-lab
spec:
  accessModes:
    - ReadWriteOnce

  storageClassName: local-path

  resources:
    requests:
      storage: 2Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino-coordinator
  namespace: de-lab
spec:
  replicas: 1

  selector:
    matchLabels:
      app: trino-coordinator

  template:
    metadata:
      labels:
        app: trino-coordinator

    spec:
      securityContext:
        fsGroup: 1000

      initContainers:
        - name: fix-volume-permission
          image: busybox:1.36

          command:
            - sh
            - -c
            - |
              mkdir -p /data/trino
              chown -R 1000:1000 /data/trino

          volumeMounts:
            - name: trino-storage
              mountPath: /data/trino

      containers:
        - name: trino
          image: trinodb/trino:440

          ports:
            - name: http
              containerPort: 8080

          volumeMounts:

            - name: base-config-volume
              mountPath: /etc/trino/node.properties
              subPath: node.properties

            - name: base-config-volume
              mountPath: /etc/trino/jvm.config
              subPath: jvm.config

            - name: base-config-volume
              mountPath: /etc/trino/config.properties
              subPath: config.properties

            - name: catalog-config-volume
              mountPath: /etc/trino/catalog/tpch.properties
              subPath: tpch.properties

            - name: catalog-config-volume
              mountPath: /etc/trino/catalog/postgres.properties
              subPath: postgres.properties

            - name: catalog-config-volume
              mountPath: /etc/trino/catalog/hive.properties
              subPath: hive.properties

            - name: trino-storage
              mountPath: /data/trino

          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"

            limits:
              memory: "2Gi"
              cpu: "2"

      volumes:

        - name: base-config-volume
          configMap:
            name: trino-coordinator-base-config

        - name: catalog-config-volume
          configMap:
            name: trino-coordinator-catalog-config

        - name: trino-storage
          persistentVolumeClaim:
            claimName: trino-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: trino-coordinator
  namespace: de-lab
spec:
  type: NodePort

  selector:
    app: trino-coordinator

  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30088