apiVersion: v1
kind: Namespace
metadata:
  name: de-lab

---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: trino-pvc
  namespace: de-lab
spec:
  accessModes:
    - ReadWriteOnce

  storageClassName: local-path

  resources:
    requests:
      storage: 2Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino-coordinator
  namespace: de-lab
spec:
  replicas: 1

  selector:
    matchLabels:
      app: trino-coordinator

  template:
    metadata:
      labels:
        app: trino-coordinator

    spec:
      securityContext:
        fsGroup: 1000

      initContainers:
        - name: fix-volume-permission
          image: busybox:1.36

          command:
            - sh
            - -c
            - |
              mkdir -p /data/trino
              chown -R 1000:1000 /data/trino

          volumeMounts:
            - name: trino-storage
              mountPath: /data/trino

      containers:
        - name: trino
          image: trinodb/trino:440

          env:
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: trino-credentials
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: trino-credentials
                  key: MINIO_SECRET_KEY
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD

          ports:
            - name: http
              containerPort: 8080

          volumeMounts:

            - name: base-config-volume
              mountPath: /etc/trino/node.properties
              subPath: node.properties

            - name: base-config-volume
              mountPath: /etc/trino/jvm.config
              subPath: jvm.config

            - name: base-config-volume
              mountPath: /etc/trino/config.properties
              subPath: config.properties

            - name: catalog-config-volume
              mountPath: /etc/trino/catalog/tpch.properties
              subPath: tpch.properties

            - name: catalog-config-volume
              mountPath: /etc/trino/catalog/postgres.properties
              subPath: postgres.properties

            - name: catalog-config-volume
              mountPath: /etc/trino/catalog/hive.properties
              subPath: hive.properties

            - name: trino-storage
              mountPath: /data/trino

          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"

            limits:
              memory: "2Gi"
              cpu: "2"

      volumes:

        - name: base-config-volume
          configMap:
            name: trino-coordinator-base-config

        - name: catalog-config-volume
          configMap:
            name: trino-coordinator-catalog-config

        - name: trino-storage
          persistentVolumeClaim:
            claimName: trino-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: trino-coordinator
  namespace: de-lab
spec:
  type: NodePort

  selector:
    app: trino-coordinator

  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30088